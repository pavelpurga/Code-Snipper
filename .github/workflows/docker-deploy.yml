name: Build, Publish Docker image and Deploy

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push-image
        env:
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          set -e
          # image tagged by sha and latest
          SHA_TAG=${GITHUB_SHA::8}
          IMAGE=${IMAGE_NAME}:${SHA_TAG}
          docker build --pull -t $IMAGE .
          docker tag $IMAGE ${IMAGE_NAME}:latest
          docker push $IMAGE
          docker push ${IMAGE_NAME}:latest
          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Install ssh client
        if: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY != '' }}
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Start ssh-agent
        if: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY != '' }}
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Remote deploy via SSH
        if: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY != '' }}
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME || 'code-snipper' }}
        run: |
          set -e
          echo "Deploying $IMAGE to ${DEPLOY_HOST}..."
          ssh -o StrictHostKeyChecking=no -p $DEPLOY_SSH_PORT $DEPLOY_USER@$DEPLOY_HOST "
            docker pull $IMAGE || exit 1
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
            docker run -d --name $CONTAINER_NAME -p 80:80 --restart unless-stopped $IMAGE
          "

  # Optional: cleanup old images on GHCR - commented out example
  # cleanup:
