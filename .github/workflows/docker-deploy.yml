name: Build, Publish Docker image and Deploy

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push-image
        env:
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          set -e
          # If IMAGE_NAME not provided via secrets, fall back to GHCR using repo path
          if [ -z "${IMAGE_NAME}" ]; then
            IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY}"
            echo "IMAGE_NAME not provided in secrets, falling back to ${IMAGE_NAME}"
          fi

          # Normalize IMAGE_NAME to lowercase (GHCR requires lowercase repo names)
          IMAGE_NAME="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "Normalized IMAGE_NAME=${IMAGE_NAME}"

          # image tagged by sha and latest
          SHA_TAG=${GITHUB_SHA::8}
          IMAGE=${IMAGE_NAME}:${SHA_TAG}
          echo "Building image: $IMAGE"
          docker build --pull -t $IMAGE .
          docker tag $IMAGE ${IMAGE_NAME}:latest
          docker push $IMAGE
          docker push ${IMAGE_NAME}:latest
          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy key
        id: check-deploy-key
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" ]; then
            echo "No SSH deploy key found in secrets, skipping deploy steps."
            echo "deploy=false" >> $GITHUB_OUTPUT
          else
            echo "deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Install ssh client
        if: ${{ steps.check-deploy-key.outputs.deploy == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Start ssh-agent
        if: ${{ steps.check-deploy-key.outputs.deploy == 'true' }}
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Remote deploy via SSH
        if: ${{ steps.check-deploy-key.outputs.deploy == 'true' }}
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME || 'code-snipper' }}
        run: |
          set -e
          echo "Preparing deploy.env on runner (will be copied to remote)..."
          # create deploy.env file with secrets on runner
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\nVITE_CURRENCYLAYER_API_KEY=%s\n' "${{ secrets.VITE_SUPABASE_URL }}" "${{ secrets.VITE_SUPABASE_ANON_KEY }}" "${{ secrets.VITE_CURRENCYLAYER_API_KEY }}" > deploy.env

          # ensure ssh is available and scp will work (ssh-agent step already added)
          echo "Copying deploy.env to remote host..."
          scp -P ${DEPLOY_SSH_PORT} deploy.env ${DEPLOY_USER}@${DEPLOY_HOST}:/home/${DEPLOY_USER}/.env

          echo "Deploying $IMAGE to ${DEPLOY_HOST}..."
          ssh -p ${DEPLOY_SSH_PORT} ${DEPLOY_USER}@${DEPLOY_HOST} "docker pull ${IMAGE} && docker stop ${CONTAINER_NAME} || true && docker rm ${CONTAINER_NAME} || true && docker run -d --name ${CONTAINER_NAME} --env-file /home/${DEPLOY_USER}/.env -p 80:80 --restart unless-stopped ${IMAGE}"

          # cleanup local sensitive file
          rm -f deploy.env

  # Optional: cleanup old images on GHCR - commented out example
  # cleanup:
  #   runs-on: ubuntu-latest
  #   needs: build-and-push
  #   steps:
  #     - name: Cleanup placeholder
  #       run: echo 'Implement image cleanup if needed'
