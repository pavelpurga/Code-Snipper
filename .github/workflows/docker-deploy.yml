# yaml
name: Build, Publish Docker image and Deploy

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push-image
        env:
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_NAME}" ]; then
            IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY}"
          fi
          IMAGE_NAME="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          SHA_TAG=${GITHUB_SHA::8}
          IMAGE=${IMAGE_NAME}:${SHA_TAG}
          docker build --pull -t "$IMAGE" .
          docker tag "$IMAGE" "${IMAGE_NAME}:latest"
          docker push "$IMAGE"
          docker push "${IMAGE_NAME}:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy key
        id: check-deploy-key
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ssh client
        if: ${{ steps.check-deploy-key.outputs.deploy == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Start ssh-agent
        if: ${{ steps.check-deploy-key.outputs.deploy == 'true' }}
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Remote deploy via SSH
        if: ${{ steps.check-deploy-key.outputs.deploy == 'true' }}
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME || 'code-snipper' }}
        run: |
          set -euo pipefail
          echo "Preparing deploy.env on runner (will be copied to remote)..."

          # Create deploy.env on runner from secrets (do not print values)
          printf '%s\n' "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" \
                         "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
                         "VITE_CURRENCYLAYER_API_KEY=${{ secrets.VITE_CURRENCYLAYER_API_KEY }}" > deploy.env
          chmod 600 deploy.env

          echo "Copying deploy.env to remote host..."
          # disable strict host checking to avoid interactive prompt in fresh runners
          scp -o StrictHostKeyChecking=no -P "${DEPLOY_SSH_PORT}" deploy.env "${DEPLOY_USER}@${DEPLOY_HOST}:/home/${DEPLOY_USER}/.env"

          echo "Verifying remote .env existence..."
          ssh -o StrictHostKeyChecking=no -p "${DEPLOY_SSH_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" "test -f /home/${DEPLOY_USER}/.env && echo ok || (echo 'deploy env missing' && exit 2)"

          echo "Deploying ${IMAGE} to ${DEPLOY_HOST}..."
          ssh -o StrictHostKeyChecking=no -p "${DEPLOY_SSH_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker pull ${IMAGE} \
             && docker stop ${CONTAINER_NAME} || true \
             && docker rm ${CONTAINER_NAME} || true \
             && docker run -d --name ${CONTAINER_NAME} --env-file /home/${DEPLOY_USER}/.env -p 80:80 --restart unless-stopped ${IMAGE}"

          rm -f deploy.env
