<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/code-snipper.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snippet Box</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Runtime config loader: fetch fresh runtime-config.js (no cache) and insert before app bundle -->
    <script>
      (function() {
        // Unregister existing service workers to avoid serving stale runtime-config from SW cache
        if ('serviceWorker' in navigator) {
          try {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            }).catch(function(){});
          } catch (e) {}
        }

        // Load runtime-config.js with no-cache to ensure freshest values
        function insertRuntimeScript(text) {
          try {
            var s = document.createElement('script');
            s.type = 'text/javascript';
            s.text = text;
            document.head.appendChild(s);
          } catch (e) {
            console.error('Failed to insert runtime-config script', e);
          }
        }

        var runtimeUrl = '/runtime-config.js';
        // Try fetch with no-store; fallback to adding script tag if fetch fails
        try {
          fetch(runtimeUrl, { cache: 'no-store', credentials: 'same-origin' }).then(function(resp) {
            if (!resp.ok) throw new Error('Failed to fetch runtime-config');
            return resp.text();
          }).then(function(text) {
            insertRuntimeScript(text);
          }).catch(function() {
            // fallback to classic script tag if fetch fails
            var s = document.createElement('script');
            s.src = runtimeUrl + '?_=' + Date.now();
            s.defer = true;
            document.head.appendChild(s);
          });
        } catch (e) {
          var s = document.createElement('script');
          s.src = runtimeUrl + '?_=' + Date.now();
          s.defer = true;
          document.head.appendChild(s);
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
